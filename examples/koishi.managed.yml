# One persistent app, references only. Provision the first administrator offline.
daemon:
  autoRestart: false
plugins:
  post:
    data_dir: data
    master_key_file: keys/post.key
    port: 18787
    accounts: []
    bindings: []
  server:
    host: 127.0.0.1
    port: 5140
  console:
    uiPath: ''
    apiPath: /status
    selfUrl: ''
    open: false
    devMode: false
  http: {}
  proxy-agent: {}
  auth:
    admin:
      enabled: false
  config: {}
  market: {}
  insight: {}
  analytics: {}
  logger:
    root: logs
  status: {}
  theme-vanilla: {}
