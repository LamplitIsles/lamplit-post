# Native Koishi appearance preview ONLY: VPN entry, no human authentication.
# Keep accounts/bindings empty. No credentials, tokens, messages or write plugins.
# Replace the four artifact-root markers with the immutable absolute artifact root
# under HOME. Reject colons, apostrophes, interpolation and control characters.
# Package entries are absolute so config-directory packages cannot shadow them.
daemon:
  autoRestart: false
plugins:
  '__POST_ARTIFACT_ROOT__/node_modules/@koishijs/plugin-server/index.cjs':
    host: 127.0.0.1
    port: 5140
  '__POST_ARTIFACT_ROOT__/node_modules/@koishijs/plugin-console/lib/node/index.js':
    uiPath: ''
    apiPath: /status
    selfUrl: ''
    open: false
    devMode: false
  '__POST_ARTIFACT_ROOT__/node_modules/@koishijs/plugin-status/lib/index.js': {}
  '__POST_ARTIFACT_ROOT__/dist/post-plugin.cjs':
    data_dir: data
    master_key_file: keys/post.key
    hostname: 127.0.0.1
    port: 18787
    accounts: []
    bindings: []
