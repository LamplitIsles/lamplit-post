# Standalone Post. References only; provision secrets offline through stdin.
data_dir = "/var/lib/lamplit-post"
master_key_file = "/etc/lamplit-post/keys/post.key"
hostname = "127.0.0.1"
port = 18787
max_asset_bytes = 16777216
timeout_ms = 30000
backlog_limit = 10000

[[accounts]]
id = "qq-main"
platform = "qq"
native_id = "REPLACE_WITH_QQ_APP_ID"
credential = "qq-platform"

[[accounts]]
id = "matrix-main"
platform = "matrix"
native_id = "@post:example.org"
homeserver = "https://matrix.example.org"
credential = "matrix-platform"

[[bindings]]
id = "partner"
agent_id = "cfl"
receiver_url = "http://127.0.0.1:3080/api/post/events"
receiver_credential = "partner-receiver"

[bindings.wake]
direct = true
mention = true
reply = true
aliases = [ "Post," ]

[[bindings.scopes]]
account_id = "qq-main"
conversation_id = "qq-owner-group"
native_id = "REPLACE_WITH_APP_SCOPED_GROUP_ID"
type = "group"

[[bindings.scopes]]
account_id = "qq-main"
conversation_id = "qq-owner-direct"
native_id = "REPLACE_WITH_APP_SCOPED_OWNER_ID"
type = "direct"
senders = [ "REPLACE_WITH_APP_SCOPED_OWNER_ID" ]

[[bindings.scopes]]
account_id = "matrix-main"
conversation_id = "matrix-owner-room"
native_id = "!room:example.org"
type = "group"

[[bindings.scopes]]
account_id = "matrix-main"
conversation_id = "matrix-owner-direct"
native_id = "!private:example.org"
type = "direct"
senders = [ "@owner:example.org" ]
